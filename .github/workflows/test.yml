name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.lock  # pinned — same set as the Docker image
      - run: pip install pytest playwright
      - run: playwright install --with-deps chromium
      - name: Run tests
        shell: bash
        run: python -m pytest tests/ -q 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -aE "FAILED|ERROR|Error|assert" pytest.log | head -20 | while read -r line; do echo "::error::${line}"; done

  docker:
    # catches broken builds before Coolify does (the mcp 2.0 incident)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build server
